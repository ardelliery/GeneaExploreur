<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Généalogie - Réseau Global & Lignées</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root { 
            --primary: #2b6cb0;    /* Bleu (Ancêtres) */
            --secondary: #c53030;  /* Rouge (Mariages) */
            --accent: #ed8936;     /* Orange (Descendants) */
            --bg: #f7fafc; 
        }
        
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); overflow: hidden; }
        
        /* Panneau de contrôle */
        #controls { 
            position: absolute; top: 15px; left: 15px; z-index: 10; 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 280px; 
        }
        
        .search-group { margin-bottom: 15px; }
        input[type="text"] { 
            width: 100%; padding: 10px; border: 1px solid #cbd5e0; 
            border-radius: 6px; box-sizing: border-box; margin-top: 5px;
        }

        /* Styles des Nœuds */
        .node circle { cursor: pointer; transition: all 0.3s; stroke: #fff; stroke-width: 1.5px; }
        .node text { font-size: 11px; pointer-events: none; font-weight: 600; fill: #2d3748; }
        
        /* Styles des Liens */
        .link { fill: none; transition: all 0.3s; stroke-opacity: 0.5; }
        
        /* Parent -> Enfant (Par défaut) */
        .link-parent { stroke: #a0aec0; stroke-width: 2px; marker-end: url(#arrow-default); }
        
        /* Mariage (Par défaut) */
        .link-marriage { stroke: var(--secondary); stroke-width: 2px; stroke-dasharray: 5,4; stroke-opacity: 0.6; }

        /* --- ÉTATS ACTIFS (HIGHLIGHT) --- */
        
        /* Nœuds */
        .node.highlight-up circle { stroke: var(--primary); stroke-width: 2px; r: 14; }
        .node.highlight-down circle { stroke: var(--accent); stroke-width: 2px; r: 14; }
        .node.selected circle { stroke: #000 !important; stroke-width: 3px; }
        .node.fade { opacity: 0.2; }

        /* Liens de lignée */
        .link.highlight-up { stroke: var(--primary) !important; stroke-width: 2px !important; stroke-opacity: 1; marker-end: url(#arrow-up) !important; stroke-dasharray: 0; }
        .link.highlight-down { stroke: var(--accent) !important; stroke-width: 2px !important; stroke-opacity: 1; marker-end: url(#arrow-down) !important; stroke-dasharray: 0; }
        
        /* Liens de mariage de la personne concernée */
        .link.highlight-marriage { stroke: var(--secondary) !important; stroke-width: 2px !important; stroke-opacity: 1; stroke-dasharray: 0; }
        
        .link.fade { opacity: 0.15; }

        /* Décoration historique */
        .hist-label { font-size: 12px; fill: #cbd5e0; font-weight: 900; pointer-events: none; }
        .year-line { stroke: #e2e8f0; stroke-dasharray: 4,4; }
        /* Style pour les conjoints (mariés à la lignée mais pas ancêtres/descendants directs) */
.node.highlight-spouse circle {
    stroke: var(--secondary) !important; /* Rouge */
    stroke-width: 3px;
    stroke-dasharray: 2,2; /* Optionnel : un petit effet pointillé sur le cercle pour rappeler le lien de mariage */
}

/* On s'assure que ces nœuds ne sont pas estompés */
.node.highlight-spouse {
    opacity: 1 !important;
}
    </style>
</head>
<body>

<div id="controls">
    <h3 style="margin:0 0 15px 0; color: var(--primary);">Réseau Généalogique</h3>
    
    <div class="search-group">
        <label style="font-size:12px; font-weight:bold;">Rechercher un membre :</label>
        <input type="text" id="search-input" list="names-list" placeholder="Commencez à taper..." oninput="onSearchInput(this.value)">
        <datalist id="names-list"></datalist>
    </div>

    <button onclick="resetView()" style="width:100%; cursor:pointer; padding:10px; background:#edf2f7; border:1px solid #cbd5e0; border-radius:6px; font-weight:bold;">
        🏠 Réinitialiser la vue
    </button>
    
    <div id="info-box" style="margin-top:15px; padding-top:15px; border-top:1px solid #edf2f7; font-size:13px;">
        <i>Cliquez sur une personne pour voir sa lignée ascendante et descendante.</i>
    </div>
</div>

<svg id="viz"></svg>

<script>
// --- CONFIGURATION ---
let width = window.innerWidth, height = window.innerHeight;
const YEAR_SPACING = 6; 
const START_YEAR = 1500;
const CURRENT_YEAR = new Date().getFullYear();

const svg = d3.select("#viz").attr("width", width).attr("height", height);
const container = svg.append("g");
const bgLayer = container.append("g");
const linkLayer = container.append("g");
const nodeLayer = container.append("g");

// Définition des flèches (Markers)
const defs = svg.append("defs");
function createMarker(id, color) {
    defs.append("marker")
        .attr("id", id).attr("viewBox", "0 -5 10 10").attr("refX", 25).attr("refY", 0)
        .attr("orient", "auto").attr("markerWidth", 6).attr("markerHeight", 6)
        .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", color);
}
createMarker("arrow-default", "#a0aec0");
createMarker("arrow-up", "#2b6cb0");
createMarker("arrow-down", "#ed8936");

// Zoom
const zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => container.attr("transform", e.transform));
svg.call(zoom);

let simulation, node, link, familyData, allNodesData;
const colorScale = d3.scaleSequential(d3.interpolateViridis).domain([1650, 2025]);

// --- INITIALISATION ---
async function init() {
    try {
        rawData = await d3.json("data.json");
        familyData = prepareFamilyData(rawData);

        allNodesData = familyData.nodes.map(d => ({...d}));
        const links = familyData.links.map(d => ({...d}));

        // Liste auto-complétion
        const list = d3.select("#names-list");
        allNodesData.sort((a,b) => a.surname.localeCompare(b.surname)).forEach(n => {
            list.append("option").attr("value", `${n.firstname} ${n.surname.toUpperCase()}`);
        });

        drawHistoryDecor();

        // Moteur de force
        simulation = d3.forceSimulation(allNodesData)
            .force("link", d3.forceLink(links).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-250))
            .force("x", d3.forceX(width / 2).strength(0.1))
            // Contrainte temporelle verticale (Y)
            .force("y", d3.forceY(d => ((d.computedBirth > 0 ? d.computedBirth : 1850) - START_YEAR) * YEAR_SPACING).strength(2))
            .force("collision", d3.forceCollide().radius(45));

        // Dessin des liens
        link = linkLayer.selectAll(".link")
            .data(links).enter().append("path")
            .attr("class", d => `link link-${d.type}`);

        // Dessin des nœuds
        node = nodeLayer.selectAll(".node")
            .data(allNodesData).enter().append("g")
            .attr("class", "node")
            .on("click", (e, d) => highlightFamily(d))
            .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

        node.append("circle")
            .attr("r", 10)
            .attr("fill", d => d.computedBirth > 0 ? colorScale(d.computedBirth) : "#cbd5e0");

        node.append("text").attr("dy", -28).attr("text-anchor", "middle")
            .text(d => d.firstname ? `${d.surname.toUpperCase()}` : '');

        node.append("text").attr("dy", -16).attr("text-anchor", "middle")
            .text(d => d.firstname ? d.firstname : d.surname.toUpperCase());

        simulation.on("tick", () => {
            link.attr("d", d => {
                const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
                const dr = d.type === 'marriage' ? Math.sqrt(dx * dx + dy * dy) * 1.5 : 0;
                return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            });
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // --- ATTENDRE LA FIN DU CALCUL POUR CENTRER ---
        simulation.on("end", () => {
            centerOnYear(CURRENT_YEAR);
        });

    } catch (error) {
        document.getElementById("info-box").innerHTML = "<b style='color:red'>Erreur de chargement. Vérifiez data.json</b>";
    }
}



function prepareFamilyData(data) {
		// 1. Initialisation du calcul des dates (votre algo original)
		data.nodes.forEach(n => { 
			n.computedBirth = (n.birth > 0) ? n.birth : null; 
		});

		let changed = true; 
		let iterations = 0;
		while (changed && iterations < 10) {
			changed = false; 
			iterations++;
			data.links.forEach(link => {
				if (link.type !== "parent") return;
				const source = data.nodes.find(n => n.id === link.source);
				const target = data.nodes.find(n => n.id === link.target);
				if (!source || !target) return;

				if (source.computedBirth && !target.computedBirth) { 
					target.computedBirth = source.computedBirth + 30; 
					changed = true; 
				}
				else if (target.computedBirth && !source.computedBirth) { 
					source.computedBirth = target.computedBirth - 30; 
					changed = true; 
				}
			});
		}

		const avgBirth = d3.mean(data.nodes.filter(n => n.birth > 0), n => n.birth) || 1900;

		// 2. Génération des champs d'affichage définitifs
		data.nodes.forEach(n => {
			// Finalisation du computedBirth si toujours nul
			if (!n.computedBirth) n.computedBirth = Math.round(avgBirth);

			// A. Formatage Naissance (Ex: "1970" ou "~1940")
			if (n.birth > 0) {
				n.displayBirth = `${n.birth}`;
			} else {
				n.displayBirth = `~${Math.round(n.computedBirth)}`;
			}

			// B. Formatage Décès (Ex: "†" ou "† 1995")
			const isDead = (n.deceased === 1 || (n.death_year && n.death_year > 0));
			n.displayDeath = "";
			if (isDead) {
				n.displayDeath = "†"; // Caractère de la croix mortuaire
				if (n.death_year && n.death_year > 0) {
					n.displayDeath += ` ${n.death_year}`;
				}
			console.log(`DEBUG: ${n.surname} display : ${n.displayBirth} // ${n.displayDeath}`);
			}
		});
	    
		return data;
	}

// --- LOGIQUE VISUELLE ---

function drawHistoryDecor() {
    for (let yr = 1600; yr <= 2050; yr += 50) {
        const yPos = (yr - START_YEAR) * YEAR_SPACING;
        bgLayer.append("line").attr("x1", -5000).attr("x2", 5000).attr("y1", yPos).attr("y2", yPos).attr("class", "year-line");
        bgLayer.append("text").attr("x", 20).attr("y", yPos - 5).attr("class", "hist-label").text(yr);
    }
}

// Fonction pour centrer sur une année précise
function centerOnYear(year) {
    const targetY = (year - START_YEAR) * YEAR_SPACING;
    svg.transition().duration(1500).call(
        zoom.transform, 
        d3.zoomIdentity.translate(width/2, height/2).scale(0.8).translate(-width/2, -targetY)
    );
}

function highlightFamily(root) {
    const upIds = new Set(), downIds = new Set();
    const upLinks = new Set(), downLinks = new Set();
    const spouseIds = new Set(); // Nouveau : pour stocker les conjoints
    
    // 1. Trouver les ancêtres
    const findUp = (id) => {
        upIds.add(id);
        familyData.links.forEach(l => {
            if (l.target === id && l.type === 'parent') {
                upLinks.add(l.source + "-" + l.target);
                findUp(l.source);
            }
        });
    };

    // 2. Trouver les descendants
    const findDown = (id) => {
        downIds.add(id);
        familyData.links.forEach(l => {
            if (l.source === id && l.type === 'parent') {
                downLinks.add(l.source + "-" + l.target);
                findDown(l.target);
            }
        });
    };

    findUp(root.id);
    findDown(root.id);

    // 3. Identifier les conjoints hors-lignée
    familyData.links.forEach(l => {
        if (l.type === 'marriage') {
            const sInLineage = upIds.has(l.source) || downIds.has(l.source);
            const tInLineage = upIds.has(l.target) || downIds.has(l.target);
            
            // Si l'un est dans la lignée et l'autre non, on marque celui qui n'y est pas
            if (sInLineage && !tInLineage) spouseIds.add(l.target);
            if (tInLineage && !sInLineage) spouseIds.add(l.source);
            // Cas particulier : les deux conjoints de la personne racine
            if (l.source === root.id) spouseIds.add(l.target);
            if (l.target === root.id) spouseIds.add(l.source);
        }
    });

    // 4. Appliquer les styles aux NŒUDS
    node.classed("highlight-up", d => upIds.has(d.id))
        .classed("highlight-down", d => downIds.has(d.id))
        .classed("highlight-spouse", d => spouseIds.has(d.id) && !upIds.has(d.id) && !downIds.has(d.id))
        .classed("fade", d => !upIds.has(d.id) && !downIds.has(d.id) && !spouseIds.has(d.id))
        .classed("selected", d => d.id === root.id);

    // 5. Appliquer les styles aux LIENS
    link.each(function(l) {
        const linkId = (typeof l.source === 'object' ? l.source.id : l.source) + "-" + (typeof l.target === 'object' ? l.target.id : l.target);
        const isUp = upLinks.has(linkId);
        const isDown = downLinks.has(linkId);
        
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;

        // Un mariage est visible si l'un des deux appartient à la lignée
        const isMarriageOfLineage = l.type === 'marriage' && 
            (upIds.has(sId) || upIds.has(tId) || downIds.has(sId) || downIds.has(tId) || sId === root.id || tId === root.id);

        d3.select(this)
            .classed("highlight-up", isUp)
            .classed("highlight-down", isDown)
            .classed("highlight-marriage", isMarriageOfLineage)
            .classed("fade", !(isUp || isDown || isMarriageOfLineage));
    });

    d3.select("#info-box").html(`
        <b style="color:var(--primary)">${root.firstname} ${root.surname.toUpperCase()}</b><br>
        📅 ${root.displayBirth} ${root.displayDeath} | 📍 ${root.place || '-'}<br>
        <span style="color:#3182ce">▲ ${upIds.size - 1} ascendants</span> | 
        <span style="color:var(--accent)">▼ ${downIds.size - 1} descendants</span>
    `);
}

function onSearchInput(val) {
    const found = allNodesData.find(n => `${n.firstname} ${n.surname.toUpperCase()}` === val);
    if (found) {
        highlightFamily(found);
        svg.transition().duration(1000).call(
            zoom.transform, 
            d3.zoomIdentity.translate(width/2, height/2).scale(1.4).translate(-found.x, -found.y)
        );
    }
}

function resetView() {
    node.classed("highlight-up highlight-down fade selected", false);
    link.classed("highlight-up highlight-down highlight-marriage fade", false);
    document.getElementById("search-input").value = "";
    svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
}

function dragstarted(event) { if (!event.active) simulation.alphaTarget(0.3).restart(); event.subject.fx = event.subject.x; event.subject.fy = event.subject.y; }
function dragged(event) { event.subject.fx = event.x; event.subject.fy = event.y; }
function dragended(event) { if (!event.active) simulation.alphaTarget(0); event.subject.fx = null; event.subject.fy = null; }

init();
</script>
</body>
</html>
